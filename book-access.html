<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Access Your Book | Flexiwallets</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-container": "#499d8f", "inverse-on-surface": "#f2f0ed",
                        "error-container": "#ffdad6", "error": "#BA1A1A", "tertiary-container": "#002e28",
                        "inverse-surface": "#30312e", "secondary": "#a14000", "outline": "#72787a",
                        "on-surface-variant": "#41484a", "on-secondary-fixed": "#351000",
                        "on-background": "#1b1c1a", "on-tertiary-fixed": "#00201c", "on-primary": "#ffffff",
                        "text-secondary": "#3E4946", "surface-container": "#F2EFE9", "surface": "#FFFFFF",
                        "surface-container-highest": "#e4e2de", "surface-dim": "#dbdad6",
                        "primary-fixed-dim": "#adccd5", "success": "#00C851", "surface-bright": "#fbf9f5",
                        "primary-container": "#0d2c33", "on-primary-fixed-variant": "#2e4b52",
                        "primary": "#00171c", "inverse-primary": "#adccd5", "accent-light": "#FF9A5C",
                        "on-secondary-fixed-variant": "#7b2f00", "on-tertiary-fixed-variant": "#005047",
                        "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#83d5c6", "outline-variant": "#c1c7ca",
                        "tertiary-fixed": "#9ff2e2", "tertiary": "#001713", "on-primary-container": "#77949c",
                        "on-error": "#ffffff", "on-error-container": "#93000a", "secondary-fixed-dim": "#ffb694",
                        "on-secondary": "#ffffff", "surface-variant": "#e4e2de", "surface-container-low": "#f5f3ef",
                        "text-hint": "#6E7976", "primary-fixed": "#c9e8f1", "surface-container-high": "#eae8e4",
                        "surface-tint": "#46636b", "on-surface": "#1b1c1a", "secondary-fixed": "#ffdbcc",
                        "secondary-container": "#ff7a32", "divider": "#BEC9C5", "background": "#fbf9f5",
                        "on-secondary-container": "#622400", "on-primary-fixed": "#001f26",
                        "surface-container-lowest": "#ffffff"
                    },
                    borderRadius: { "card": "20px" },
                    spacing: { "gutter": "16px", "section-padding": "20px", "card-padding": "16px", "stack-lg": "24px" },
                    fontFamily: {
                        "h4": ["Plus Jakarta Sans"], "display": ["Plus Jakarta Sans"], "h3": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"], "h1": ["Plus Jakarta Sans"], "body-lg": ["Manrope"],
                        "button": ["Manrope"], "body-md": ["Manrope"], "label-md": ["Manrope"],
                        "label-lg": ["Manrope"], "overline": ["Manrope"], "body-sm": ["Manrope"], "caption": ["Manrope"]
                    },
                    fontSize: {
                        "h4": ["18px", { lineHeight: "24px", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "display": ["36px", { lineHeight: "42px", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "h3": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "h2": ["24px", { lineHeight: "32px", fontWeight: "700" }],
                        "h1": ["32px", { lineHeight: "40px", fontWeight: "700" }],
                        "button": ["16px", { lineHeight: "20px", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "500" }],
                        "label-md": ["14px", { lineHeight: "18px", fontWeight: "600" }],
                        "label-lg": ["16px", { lineHeight: "20px", fontWeight: "700" }],
                        "overline": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "caption": ["12px", { lineHeight: "16px", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; }
        .custom-shadow { box-shadow: 0 4px 20px 0 rgba(13, 44, 51, 0.04); }
        .cta-shadow { box-shadow: 0 12px 24px 0 rgba(255, 122, 50, 0.28); }
        .spinner { border: 3px solid rgba(13,44,51,0.12); border-radius: 50%; border-top-color: #0d2c33; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .otp-input { letter-spacing: 0.6em; text-indent: 0.3em; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen font-body-md">

    <header class="bg-primary-container text-on-primary w-full top-0 sticky z-50 shadow-sm">
        <div class="flex items-center gap-2 px-gutter h-16 w-full max-w-[560px] mx-auto">
            <span class="material-symbols-outlined text-secondary-container">menu_book</span>
            <span class="font-h3 text-h3 text-on-primary">FlexiWallets</span>
        </div>
    </header>

    <main class="max-w-[560px] mx-auto px-4 md:px-gutter py-10">
        <div class="bg-surface rounded-card custom-shadow p-card-padding sm:p-8">
            <p class="font-overline text-overline text-secondary uppercase tracking-widest mb-2">Access your book</p>
            <h1 class="font-display text-display text-primary text-balance">Enter your phone number</h1>
            <p class="font-body-md text-body-md text-text-secondary mt-3">
                If it purchased this book, we'll text a code to read it -- no password to remember.
            </p>

            <div id="step-phone" class="mt-8">
                <label class="font-label-md text-label-md text-on-surface block mb-2">M-Pesa phone number</label>
                <input id="phone" type="tel" placeholder="07XX XXX XXX" inputmode="tel"
                    class="w-full px-4 py-4 rounded-xl border border-divider bg-surface-container-low font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container/40" />
                <p id="phone-error" class="font-caption text-caption text-error mt-2 hidden"></p>
                <button id="send-btn" onclick="requestCode()"
                    class="w-full mt-4 flex items-center justify-center gap-2 px-8 py-4 bg-secondary-container text-on-secondary-container font-button text-button rounded-xl hover:opacity-90 transition-all active:scale-95 cta-shadow">
                    <span class="material-symbols-outlined text-[20px]">sms</span>
                    Send access code
                </button>
                <p class="font-caption text-caption text-text-hint text-center mt-4">
                    Haven't bought it yet? <a id="buy-link" href="book-buy.html" class="text-secondary font-semibold">Buy the book</a>
                </p>
            </div>

            <div id="step-code" class="mt-8 hidden">
                <label class="font-label-md text-label-md text-on-surface block mb-2">6-digit code</label>
                <input id="code" type="text" maxlength="6" inputmode="numeric" placeholder="------"
                    class="otp-input w-full px-4 py-4 rounded-xl border border-divider bg-surface-container-low font-h2 text-h2 text-center text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container/40" />
                <p id="code-error" class="font-caption text-caption text-error mt-2 hidden"></p>
                <button id="verify-btn" onclick="verifyCode()"
                    class="w-full mt-4 flex items-center justify-center gap-2 px-8 py-4 bg-primary text-on-primary font-button text-button rounded-xl hover:opacity-90 transition-all active:scale-95">
                    Verify &amp; open book
                </button>
                <p class="font-caption text-caption text-text-hint text-center mt-4">
                    Didn't get it? <button onclick="requestCode()" class="text-secondary font-semibold">Resend code</button>
                </p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = 'https://api.zeegoapp.com/payments/api/v1';
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');
        const prefilledPhone = params.get('phone');
        const autoSend = params.get('auto') === '1';

        if (slug) document.getElementById('buy-link').href = `book-buy.html?slug=${slug}`;
        if (prefilledPhone) document.getElementById('phone').value = prefilledPhone;

        function requestCode() {
            const errorEl = document.getElementById('phone-error');
            const btn = document.getElementById('send-btn');
            const phone = document.getElementById('phone').value.trim();

            errorEl.classList.add('hidden');
            if (!slug) { errorEl.textContent = 'No book specified.'; errorEl.classList.remove('hidden'); return; }
            if (!phone) { errorEl.textContent = 'Enter your phone number.'; errorEl.classList.remove('hidden'); return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span> Sending…';

            fetch(`${API_BASE}/books/access/request-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slug, phone_number: phone })
            })
            .then(r => r.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">sms</span> Send access code';
                if (data.status !== '4000') {
                    errorEl.textContent = data.message || 'Could not send a code.';
                    errorEl.classList.remove('hidden');
                    return;
                }
                document.getElementById('step-phone').classList.add('hidden');
                document.getElementById('step-code').classList.remove('hidden');
                document.getElementById('code').focus();
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">sms</span> Send access code';
                errorEl.textContent = "Couldn't reach the server. Please try again.";
                errorEl.classList.remove('hidden');
            });
        }

        function verifyCode() {
            const errorEl = document.getElementById('code-error');
            const btn = document.getElementById('verify-btn');
            const phone = document.getElementById('phone').value.trim();
            const code = document.getElementById('code').value.trim();

            errorEl.classList.add('hidden');
            if (!code) { errorEl.textContent = 'Enter the code we sent you.'; errorEl.classList.remove('hidden'); return; }

            btn.disabled = true;
            btn.textContent = 'Verifying…';

            fetch(`${API_BASE}/books/access/verify-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slug, phone_number: phone, code })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status !== '4000' || !data.detail || !data.detail.token) {
                    btn.disabled = false;
                    btn.textContent = 'Verify & open book';
                    errorEl.textContent = data.message || 'That code is invalid or has expired.';
                    errorEl.classList.remove('hidden');
                    return;
                }
                // Plain top-level navigation (not a fetch) -- lets the
                // backend set a same-origin cookie with zero CORS
                // complications, then drop the buyer straight into their
                // own book pages, gated from there on by that cookie.
                window.location.href = `https://api.zeegoapp.com${data.detail.enter_url}`;
            })
            .catch(() => {
                btn.disabled = false;
                btn.textContent = 'Verify & open book';
                errorEl.textContent = "Couldn't reach the server. Please try again.";
                errorEl.classList.remove('hidden');
            });
        }

        if (autoSend && slug && prefilledPhone) {
            requestCode();
        }
    </script>
</body>
</html>
