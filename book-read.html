<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Reading | Flexiwallets</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-container": "#499d8f", "inverse-on-surface": "#f2f0ed",
                        "error-container": "#ffdad6", "error": "#BA1A1A", "tertiary-container": "#002e28",
                        "inverse-surface": "#30312e", "secondary": "#a14000", "outline": "#72787a",
                        "on-surface-variant": "#41484a", "on-secondary-fixed": "#351000",
                        "on-background": "#1b1c1a", "on-tertiary-fixed": "#00201c", "on-primary": "#ffffff",
                        "text-secondary": "#3E4946", "surface-container": "#F2EFE9", "surface": "#FFFFFF",
                        "surface-container-highest": "#e4e2de", "surface-dim": "#dbdad6",
                        "primary-fixed-dim": "#adccd5", "success": "#00C851", "surface-bright": "#fbf9f5",
                        "primary-container": "#0d2c33", "on-primary-fixed-variant": "#2e4b52",
                        "primary": "#00171c", "inverse-primary": "#adccd5", "accent-light": "#FF9A5C",
                        "on-secondary-fixed-variant": "#7b2f00", "on-tertiary-fixed-variant": "#005047",
                        "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#83d5c6", "outline-variant": "#c1c7ca",
                        "tertiary-fixed": "#9ff2e2", "tertiary": "#001713", "on-primary-container": "#77949c",
                        "on-error": "#ffffff", "on-error-container": "#93000a", "secondary-fixed-dim": "#ffb694",
                        "on-secondary": "#ffffff", "surface-variant": "#e4e2de", "surface-container-low": "#f5f3ef",
                        "text-hint": "#6E7976", "primary-fixed": "#c9e8f1", "surface-container-high": "#eae8e4",
                        "surface-tint": "#46636b", "on-surface": "#1b1c1a", "secondary-fixed": "#ffdbcc",
                        "secondary-container": "#ff7a32", "divider": "#BEC9C5", "background": "#fbf9f5",
                        "on-secondary-container": "#622400", "on-primary-fixed": "#001f26",
                        "surface-container-lowest": "#ffffff"
                    },
                    borderRadius: { "card": "20px" },
                    spacing: { "gutter": "16px", "section-padding": "20px", "card-padding": "16px", "stack-lg": "24px" },
                    fontFamily: {
                        "h4": ["Plus Jakarta Sans"], "display": ["Plus Jakarta Sans"], "h3": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"], "h1": ["Plus Jakarta Sans"], "body-lg": ["Manrope"],
                        "button": ["Manrope"], "body-md": ["Manrope"], "label-md": ["Manrope"],
                        "label-lg": ["Manrope"], "overline": ["Manrope"], "body-sm": ["Manrope"], "caption": ["Manrope"]
                    },
                    fontSize: {
                        "h4": ["18px", { lineHeight: "24px", fontWeight: "600" }],
                        "body-lg": ["19px", { lineHeight: "32px", fontWeight: "400" }],
                        "display": ["30px", { lineHeight: "38px", letterSpacing: "-0.01em", fontWeight: "800" }],
                        "h3": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "h2": ["24px", { lineHeight: "32px", fontWeight: "700" }],
                        "h1": ["32px", { lineHeight: "40px", fontWeight: "700" }],
                        "button": ["16px", { lineHeight: "20px", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "500" }],
                        "label-md": ["14px", { lineHeight: "18px", fontWeight: "600" }],
                        "label-lg": ["16px", { lineHeight: "20px", fontWeight: "700" }],
                        "overline": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "caption": ["12px", { lineHeight: "16px", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; }
        .custom-shadow { box-shadow: 0 4px 20px 0 rgba(13, 44, 51, 0.04); }
        .spinner { border: 3px solid rgba(13,44,51,0.12); border-radius: 50%; border-top-color: #0d2c33; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #chapter-body p { margin-bottom: 1.25em; }
        #chapter-body h2, #chapter-body h3 { font-family: 'Plus Jakarta Sans', sans-serif; color: #0d2c33; margin: 1.5em 0 0.5em; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen font-body-md">

    <header class="bg-primary-container text-on-primary w-full top-0 sticky z-50 shadow-sm">
        <div class="flex items-center justify-between px-gutter h-16 w-full max-w-[900px] mx-auto">
            <div class="flex items-center gap-2 min-w-0">
                <button onclick="toggleToc()" class="p-1 sm:hidden" aria-label="Chapters">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <span class="material-symbols-outlined text-secondary-container">menu_book</span>
                <span id="book-title" class="font-h3 text-h3 text-on-primary truncate">Loading…</span>
            </div>
        </div>
    </header>

    <div id="app" class="max-w-[900px] mx-auto px-4 md:px-gutter py-10">
        <div class="text-center py-20">
            <div class="spinner mx-auto w-8 h-8"></div>
            <p class="font-body-sm text-body-sm text-text-hint mt-4">Opening your book…</p>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.zeegoapp.com/payments/api/v1';
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');
        const app = document.getElementById('app');

        function storedToken() {
            try { return localStorage.getItem(`book_token_${slug}`); } catch (e) { return null; }
        }
        function saveToken(t) {
            try { localStorage.setItem(`book_token_${slug}`, t); } catch (e) { /* ignore */ }
        }

        // URL token (from the redirect right after verify-otp) takes priority
        // once, then gets persisted -- covers private-browsing sessions where
        // localStorage silently doesn't stick.
        let token = params.get('token') || storedToken();
        if (params.get('token')) saveToken(params.get('token'));

        function toAccess() {
            window.location.href = slug ? `book-access.html?slug=${slug}` : 'book-access.html';
        }

        function errorState(message) {
            app.innerHTML = `
                <div class="text-center py-20">
                    <span class="material-symbols-outlined text-error text-[40px]">error_outline</span>
                    <p class="font-body-md text-body-md text-on-surface mt-3">${message}</p>
                </div>`;
        }

        if (!slug) {
            errorState('No book specified.');
        } else if (!token) {
            toAccess();
        } else {
            loadChapters();
        }

        let chaptersToc = [];
        let bookTitle = '';

        function loadChapters() {
            fetch(`${API_BASE}/books/read/${encodeURIComponent(slug)}/chapters?token=${encodeURIComponent(token)}`)
                .then(r => {
                    if (r.status === 401) { try { localStorage.removeItem(`book_token_${slug}`); } catch(e){} toAccess(); throw new Error('unauthorized'); }
                    return r.json();
                })
                .then(data => {
                    if (data.status !== '4000') throw new Error('failed');
                    chaptersToc = data.detail.chapters || [];
                    bookTitle = data.detail.title || '';
                    document.getElementById('book-title').textContent = bookTitle;
                    if (chaptersToc.length === 0) {
                        errorState('This book has no chapters yet.');
                        return;
                    }
                    const chapterParam = parseInt(params.get('chapter'), 10);
                    const first = chaptersToc.some(c => c.number === chapterParam) ? chapterParam : chaptersToc[0].number;
                    renderShell();
                    loadChapter(first);
                })
                .catch((e) => { if (e.message !== 'unauthorized') errorState("Couldn't load this book."); });
        }

        function renderShell() {
            app.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-[220px_1fr] gap-8">
                    <aside id="toc" class="hidden sm:block">
                        <p class="font-overline text-overline text-secondary uppercase tracking-widest mb-3">Chapters</p>
                        <nav class="space-y-1" id="toc-list"></nav>
                    </aside>
                    <article>
                        <div id="chapter-head"></div>
                        <div id="chapter-body" class="font-body-lg text-body-lg text-on-surface mt-4"></div>
                        <div id="chapter-nav" class="flex items-center justify-between mt-10 pt-6 border-t border-divider/30"></div>
                    </article>
                </div>`;
            renderToc(null);
        }

        function renderToc(activeNumber) {
            document.getElementById('toc-list').innerHTML = chaptersToc.map(c => `
                <button onclick="loadChapter(${c.number})"
                    class="w-full text-left px-3 py-2 rounded-lg font-body-sm text-body-sm transition-colors ${c.number === activeNumber ? 'bg-secondary-container/15 text-secondary font-semibold' : 'text-text-secondary hover:bg-surface-container'}">
                    ${c.number}. ${c.title}
                </button>`).join('');
        }

        function toggleToc() {
            document.getElementById('toc').classList.toggle('hidden');
        }

        function loadChapter(number) {
            document.getElementById('chapter-body').innerHTML = `<div class="text-center py-16"><div class="spinner mx-auto w-6 h-6"></div></div>`;

            fetch(`${API_BASE}/books/read/${encodeURIComponent(slug)}/chapter/${number}?token=${encodeURIComponent(token)}`)
                .then(r => {
                    if (r.status === 401) { try { localStorage.removeItem(`book_token_${slug}`); } catch(e){} toAccess(); throw new Error('unauthorized'); }
                    return r.json();
                })
                .then(data => {
                    if (data.status !== '4000') throw new Error('failed');
                    const ch = data.detail;
                    document.getElementById('chapter-head').innerHTML = `
                        <p class="font-overline text-overline text-secondary uppercase tracking-widest">Chapter ${ch.number}</p>
                        <h1 class="font-h1 text-h1 text-primary text-balance mt-1">${ch.title}</h1>`;
                    document.getElementById('chapter-body').innerHTML = ch.content_html;
                    renderToc(ch.number);
                    renderChapterNav(ch.number);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    history.replaceState(null, '', `book-read.html?slug=${slug}&chapter=${ch.number}`);
                })
                .catch((e) => { if (e.message !== 'unauthorized') errorState("Couldn't load this chapter."); });
        }

        function renderChapterNav(current) {
            const idx = chaptersToc.findIndex(c => c.number === current);
            const prev = idx > 0 ? chaptersToc[idx - 1] : null;
            const next = idx >= 0 && idx < chaptersToc.length - 1 ? chaptersToc[idx + 1] : null;
            document.getElementById('chapter-nav').innerHTML = `
                ${prev ? `<button onclick="loadChapter(${prev.number})" class="flex items-center gap-1 font-label-md text-label-md text-primary"><span class="material-symbols-outlined text-[18px]">arrow_back</span> ${prev.title}</button>` : '<span></span>'}
                ${next ? `<button onclick="loadChapter(${next.number})" class="flex items-center gap-1 font-label-md text-label-md text-primary">${next.title} <span class="material-symbols-outlined text-[18px]">arrow_forward</span></button>` : '<span></span>'}
            `;
        }
    </script>
</body>
</html>
