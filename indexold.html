<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="FlexiWallets Admin Portal - Manage products, merchants, and content">
    <title>FlexiWallets Admin Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Load modules in order -->
    <script type="text/babel" data-type="module" src="./utils/constants.js"></script>
    <script type="text/babel" data-type="module" src="./services/api.js"></script>
    <script type="text/babel" data-type="module" src="./components/Icons.js"></script>
    <script type="text/babel" data-type="module" src="./components/Login.js"></script>
    <script type="text/babel" data-type="module" src="./components/Dashboard.js"></script>
    <script type="text/babel" data-type="module" src="./components/ProductModal.js"></script>
    <script type="text/babel" data-type="module" src="./components/MerchantModal.js"></script>
    <script type="text/babel" data-type="module" src="./components/DiscountModal.js"></script>
    <script type="text/babel" data-type="module" src="./components/InfluencerModal.js"></script>
    <script type="text/babel" data-type="module" src="./components/Products.js"></script>
    <script type="text/babel" data-type="module" src="./components/Merchants.js"></script>
    <script type="text/babel" data-type="module" src="./components/Discounts.js"></script>
    <script type="text/babel" data-type="module" src="./components/Influencers.js"></script>
    <script type="text/babel" data-type="module" src="./App.js"></script>
</body>
</html>
